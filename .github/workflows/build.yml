name: Build & Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          NAME=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "PadLauncher-v${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PadLauncher-v${{ steps.version.outputs.name }}
          path: PadLauncher-v${{ steps.version.outputs.name }}.apk

      # Publishes a GitHub Release only for pushes to the default branch, and only
      # when VERSION_NAME is new. The app's updater reads the latest release.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists. Bump VERSION_NAME in version.properties to publish a new release."
            exit 0
          fi
          # Release notes = the "## X.Y.Z" section of CHANGELOG.md
          awk -v ver="$VERSION" '
            /^## / { p = (index($0, "## " ver " ") == 1 || $0 == "## " ver); next }
            p
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then NOTES=(--notes-file notes.md); else NOTES=(--generate-notes); fi
          gh release create "$TAG" "PadLauncher-$TAG.apk" \
            --title "Pad Launcher $TAG" \
            --target "$GITHUB_SHA" \
            --latest \
            "${NOTES[@]}"
